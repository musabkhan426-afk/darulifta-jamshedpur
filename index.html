<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آن لائن دارالافتاء - AI Search</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Urdu Nastaliq) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        urdu: ['"Noto Nastaliq Urdu"', 'serif'],
                        sansEng: ['system-ui', 'sans-serif']
                    },
                    colors: {
                        royal: {
                            800: '#1e3a8a',
                            900: '#172554',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Nastaliq Urdu', serif;
            background-color: #f8fafc;
            line-height: 2.2;
        }
        .font-sans-eng {
            font-family: system-ui, -apple-system, sans-serif;
            direction: ltr;
            display: inline-block;
        }
    </style>
</head>
<body class="text-slate-800 h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-gradient-to-l from-royal-900 to-slate-800 text-white shadow-md relative z-10">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="window.router('home')">
                <div class="bg-amber-500 text-royal-900 p-2 rounded-lg">
                    <i class="fa-solid fa-book-open text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-2xl leading-none">آن لائن دارالافتاء</h1>
                    <p class="text-xs text-amber-300">جدید و مستند شرعی رہنمائی</p>
                </div>
            </div>
            
            <nav class="hidden md:flex gap-6 items-center">
                <button onclick="window.router('home')" class="hover:text-amber-400 transition font-bold">صفحہ اول</button>
                <button onclick="window.router('fatawa')" class="hover:text-amber-400 transition font-bold">فتاویٰ آرکائیو</button>
                <button onclick="window.router('ask')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-5 py-2 rounded-full font-bold shadow transition">فتویٰ پوچھیں</button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow overflow-y-auto p-4 md:p-8">
        <div id="app" class="container mx-auto max-w-5xl">
            <!-- Content will be injected here by JavaScript -->
        </div>
    </main>

    <script>
        // --- 1. STATE MANAGEMENT (Mock Data) ---
        const state = {
            currentView: 'home',
            questions: [
                { id: 'F-104', category: 'جدید مالی معاملات', title: 'ڈیجیٹل کرنسی میں سرمایہ کاری', text: 'کیا کرپٹو کرنسی میں سرمایہ کاری کرنا شرعاً جائز ہے؟', answer: 'ڈیجیٹل کرنسی میں غرر اور جہالت پائی جاتی ہے، نیز یہ کسی مستند حکومت کی طرف سے جاری کردہ نہیں ہے، اس لیے اس میں سرمایہ کاری سے اجتناب ضروری ہے۔' },
                { id: 'F-103', category: 'زکوۃ و صدقات', title: 'پراپرٹی پر زکوٰۃ کا حکم', text: 'جو پلاٹ بیچنے کی نیت سے خریدا ہو کیا اس پر زکوٰۃ فرض ہے؟', answer: 'جی ہاں، جو پلاٹ تجارت (بیچنے) کی نیت سے خریدا گیا ہو اس کی موجودہ مالیت پر زکوٰۃ فرض ہے۔' },
                { id: 'F-102', category: 'نماز', title: 'سفر میں قصر کا تفصیلی حکم', text: 'شرعی سفر کی مسافت کتنی ہے اور قصر کب تک کی جائے گی؟', answer: 'شرعی سفر کی مسافت 48 میل (تقریباً 77.24 کلومیٹر) ہے۔ اگر کوئی شخص اتنے سفر کے ارادے سے اپنی بستی سے نکلے تو وہ مسافر کہلائے گا۔' }
            ]
        };

        // --- 2. ROUTER ---
        window.router = function(view, id = null) {
            state.currentView = view;
            const app = document.getElementById('app');
            app.innerHTML = ''; // Clear current content

            if (view === 'home') renderHome(app);
            if (view === 'ask') renderAsk(app);
            if (view === 'fatawa') renderFatawa(app);
            if (view === 'detail' && id) renderDetail(app, id);
        };

        // --- 3. VIEWS ---

        // Home View
        function renderHome(c) {
            c.innerHTML = `
                <div class="text-center space-y-6 mt-10">
                    <h2 class="text-3xl md:text-5xl font-bold text-royal-900 leading-tight">آپ کے شرعی مسائل، <br><span class="text-amber-500">مستند رہنمائی</span></h2>
                    <p class="text-slate-600 max-w-2xl mx-auto text-lg">قرآن و سنت کی روشنی میں اپنے روزمرہ مسائل کا حل جانیے۔ ہمارا سمارٹ سسٹم آپ کو مطلوبہ فتاویٰ تک باآسانی پہنچنے میں مدد فراہم کرتا ہے۔</p>
                    
                    <div class="flex justify-center gap-4 pt-6">
                        <button onclick="window.router('ask')" class="bg-royal-900 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-royal-800 transition"><i class="fa-solid fa-pen-nib ml-2"></i> سوال بھیجیں</button>
                        <button onclick="window.router('fatawa')" class="bg-white text-royal-900 border border-royal-900 px-8 py-3 rounded-full font-bold shadow-sm hover:bg-slate-50 transition"><i class="fa-solid fa-magnifying-glass ml-2"></i> فتاویٰ تلاش کریں</button>
                    </div>
                </div>
            `;
        }

        // Ask Fatwa View
        function renderAsk(c) {
            c.innerHTML = `
                <div class="max-w-2xl mx-auto bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                    <h3 class="text-2xl font-bold text-royal-900 mb-6 border-b pb-4"><i class="fa-solid fa-pen text-amber-500 ml-2"></i> نیا سوال / فتویٰ پوچھیں</h3>
                    <form onsubmit="event.preventDefault(); alert('آپ کا سوال موصول ہوگیا ہے! جلد جواب دیا جائے گا۔'); window.router('home');" class="space-y-5">
                        <div>
                            <label class="block font-bold mb-2">نام (اختیاری)</label>
                            <input type="text" class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none" placeholder="اپنا نام درج کریں">
                        </div>
                        <div>
                            <label class="block font-bold mb-2">موضوع / عنوان <span class="text-red-500">*</span></label>
                            <input type="text" required class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none" placeholder="سوال کا مختصر عنوان">
                        </div>
                        <div>
                            <label class="block font-bold mb-2">تفصیلی سوال <span class="text-red-500">*</span></label>
                            <textarea required rows="5" class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none" placeholder="اپنا مسئلہ تفصیل سے واضح کریں..."></textarea>
                        </div>
                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl shadow transition text-lg">سوال ارسال کریں</button>
                    </form>
                </div>
            `;
        }

        // Fatawa Archive View (WITH AI SEARCH)
        function renderFatawa(c) {
            c.innerHTML = `
                <div class="flex flex-col md:flex-row gap-6">
                    
                    <!-- Sidebar Filters -->
                    <div class="w-full md:w-64 bg-white p-5 rounded-3xl border border-slate-200 h-fit space-y-4 shadow-sm">
                        <h3 class="font-bold text-lg border-b pb-2 text-royal-900"><i class="fa-solid fa-layer-group ml-2 text-amber-500"></i> ابواب و موضوعات</h3>
                        <ul class="space-y-3 text-slate-700">
                            <li class="hover:text-amber-600 cursor-pointer font-bold bg-slate-50 p-2 rounded-lg">تمام فتاویٰ</li>
                            <li class="hover:text-amber-600 cursor-pointer p-2">عقائد و ایمانیات</li>
                            <li class="hover:text-amber-600 cursor-pointer p-2">طہارت و نماز</li>
                            <li class="hover:text-amber-600 cursor-pointer p-2">زکوۃ و صدقات</li>
                            <li class="hover:text-amber-600 cursor-pointer p-2">نکاح و طلاق</li>
                            <li class="hover:text-amber-600 cursor-pointer p-2">جدید مالی معاملات</li>
                        </ul>
                    </div>
                    
                    <!-- Main List & AI Search -->
                    <div class="flex-grow space-y-6">
                        
                        <!-- AI Smart Search Box (New Integration) -->
                        <div class="bg-gradient-to-br from-royal-900 to-slate-900 p-6 md:p-8 rounded-3xl shadow-lg relative overflow-hidden border border-amber-500/30">
                            <!-- Decorative background icon -->
                            <i class="fa-solid fa-microchip absolute -right-4 -bottom-4 text-8xl text-white opacity-5"></i>
                            
                            <h3 class="text-white font-bold text-xl md:text-2xl mb-3 flex items-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> اے آئی سمارٹ تلاش (AI Search)
                            </h3>
                            <p class="text-slate-300 text-sm md:text-base mb-5 leading-loose">اپنا مسئلہ اپنی عام زبان میں لکھیے، ہمارا AI سسٹم مفہوم سمجھ کر درست فتویٰ تلاش کرے گا۔ (مثال: قسطوں پر بائیک لینا)</p>
                            
                            <div class="relative flex flex-col md:flex-row gap-2">
                                <input type="text" id="ai-search-input" placeholder="کیا سوال ہے آپ کا؟..." class="w-full border-none p-4 rounded-xl bg-white/95 shadow-inner pr-4 focus:outline-none focus:ring-4 focus:ring-amber-500/50 text-slate-900 font-bold">
                                <button onclick="triggerAISearch()" class="bg-gradient-to-r from-amber-500 to-amber-600 text-slate-900 px-8 py-4 md:py-auto rounded-xl font-bold shadow-md hover:scale-105 transition shrink-0 whitespace-nowrap">
                                    <i class="fa-solid fa-robot ml-2"></i> تلاش کریں
                                </button>
                            </div>
                        </div>

                        <!-- Fatawa List -->
                        <div class="space-y-4 pt-2">
                            <h4 class="font-bold text-slate-600 text-lg border-b pb-2">حالیہ شائع شدہ فتاویٰ</h4>
                            ${state.questions.map(q => `
                                <div class="bg-white p-5 md:p-6 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:shadow-md hover:border-amber-400 transition" onclick="window.router('detail', '${q.id}')">
                                    <div class="flex justify-between items-center mb-3">
                                        <span class="text-xs bg-amber-100 text-amber-800 px-3 py-1 rounded-full font-bold shadow-sm">${q.category}</span>
                                        <span class="text-xs text-slate-500 font-sans-eng font-bold bg-slate-100 px-2 py-1 rounded">${q.id}</span>
                                    </div>
                                    <h4 class="font-bold text-xl text-royal-900 mb-2">${q.title}</h4>
                                    <p class="text-slate-600 line-clamp-2">${q.text}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Fatwa Detail View
        function renderDetail(c, id) {
            const fatwa = state.questions.find(q => q.id === id);
            if (!fatwa) return;

            c.innerHTML = `
                <div class="max-w-3xl mx-auto">
                    <button onclick="window.router('fatawa')" class="text-slate-500 hover:text-amber-600 mb-4 font-bold transition"><i class="fa-solid fa-arrow-right ml-2"></i> واپس فہرست میں جائیں</button>
                    
                    <div class="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-slate-200">
                        <div class="flex justify-between items-center mb-6 border-b pb-4">
                            <span class="bg-royal-900 text-white px-4 py-1 rounded-full text-sm font-bold">${fatwa.category}</span>
                            <span class="text-sm text-slate-500 font-sans-eng font-bold">رقم الفتوی: ${fatwa.id}</span>
                        </div>
                        
                        <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mb-6 leading-relaxed">${fatwa.title}</h2>
                        
                        <div class="bg-slate-50 p-6 rounded-2xl mb-8 border border-slate-100 relative">
                            <h3 class="font-bold text-amber-600 mb-2">سوال:</h3>
                            <p class="text-slate-800 text-lg">${fatwa.text}</p>
                        </div>
                        
                        <div class="p-2">
                            <h3 class="font-bold text-royal-900 mb-3 text-xl border-b inline-block pb-1">الجواب بعون الوہاب:</h3>
                            <p class="text-slate-800 text-lg leading-loose">${fatwa.answer}</p>
                        </div>
                        
                        <div class="mt-10 pt-6 border-t border-slate-200 text-center">
                            <p class="text-slate-500 text-sm font-bold mb-2">واللہ اعلم بالصواب</p>
                            <p class="text-slate-400 text-xs">دارالافتاء، آن لائن</p>
                        </div>
                    </div>
                </div>
            `;
        }

        // Dummy Function for AI Search Button
        window.triggerAISearch = function() {
            const query = document.getElementById('ai-search-input').value;
            if(!query) {
                alert("براہ کرم تلاش کے لیے کوئی سوال یا لفظ درج کریں۔");
                return;
            }
            alert("AI Processing...\\nآپ کا سوال: " + query + "\\n\\nیہاں بیک اینڈ کی API کال ہوگی اور ویکٹر ڈیٹا بیس (Vector DB) سے مفہوم کے لحاظ سے درست جواب تلاش کر کے نیچے دکھایا جائے گا۔");
        }

        // --- 4. INITIALIZE APP ---
        window.router('home');
    </script>
</body>
</html>
